<div class="pi-search">
  <button class="pi-search-toggle" type="button" aria-label="جستجو در سایت" aria-expanded="false">
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="pi-search-pop">
    <form class="pi-search-form" role="search" method="get" action="/">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="hidden" name="post_type" value="page">
      <input type="search" name="s" placeholder="جستجو در صفحات سایت…" autocomplete="off" aria-label="عبارت جستجو">
      <span class="pi-search-spin" aria-hidden="true"></span>
    </form>
    <div class="pi-search-results" role="listbox" aria-live="polite"></div>
  </div>
</div>
